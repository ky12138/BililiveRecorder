name: Build WPF Windows

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true

jobs:
  build_wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Packages
        run: msbuild -t:restore /m /v:m BililiveRecorder.WPF/BililiveRecorder.WPF.csproj

      - name: Build WPF - Debug
        run: msbuild /m /v:m /p:Configuration="Debug" BililiveRecorder.WPF/BililiveRecorder.WPF.csproj

      - name: Build WPF - Release
        run: msbuild /m /v:m /p:Configuration="Release" BililiveRecorder.WPF/BililiveRecorder.WPF.csproj

      - name: Upload Artifacts - Debug
        uses: actions/upload-artifact@v4
        with:
          name: WPF-Debug
          path: BililiveRecorder.WPF/bin/Debug

      - name: Upload Artifacts - Release
        uses: actions/upload-artifact@v4
        with:
          name: WPF-Release
          path: BililiveRecorder.WPF/bin/Release
